gradle.beforeProject { project ->
    project.afterEvaluate {
        project.minecraft.runs.client.workingDirectory(project.file('run-matrix-check'))
        project.minecraft.runs.client.property('alone_mechanical.verifyMatrix','true')
        project.minecraft.runs.client.args('--quickPlaySingleplayer','Matrix Preview','--width','1280','--height','720')
        project.minecraft.runs.client.mods.getByName(project.mod_id).source(project.sourceSets.gameTest)
    }
}
