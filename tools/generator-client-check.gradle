gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('build/generator-check'))
    project.afterEvaluate {
        project.minecraft.runs.client.workingDirectory(project.file('run-generator-check'))
        project.minecraft.runs.client.property('alone_mechanical.verifyGenerators','true')
        project.minecraft.runs.client.args('--quickPlaySingleplayer','Machine GUI Preview','--width','1280','--height','720')
        project.minecraft.runs.client.mods.getByName(project.mod_id).source(project.sourceSets.gameTest)
    }
}
